version: "3.9"

services:
  asterisk:
    container_name: asterisk
    build:
      context: .
      dockerfile: Dockerfile
    image: asterisk:latest
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "5060:5060/udp"
      - "5061:5061/tcp"
      - "10000-20000:10000-20000/udp"
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/asterisk.conf:/etc/asterisk/asterisk.conf:ro
      - ./asterisk/modules.conf:/etc/asterisk/modules.conf:ro
      - ./data/log:/var/log/asterisk
      - ./data/spool:/var/spool/asterisk
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s