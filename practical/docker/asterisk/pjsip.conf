[global]
type = global
user_agent = PBX for Dummies Docker
debug = 0

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
local_net = 127.0.0.1/32
external_media_address = 
external_signaling_address = 

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060
local_net = 127.0.0.1/32
external_media_address = 
external_signaling_address = 

[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:8089

; Template for endpoints
[endpoint-template](!)
type = endpoint
context = internal
disallow = all
allow = ulaw
allow = alaw
allow = gsm
direct_media = yes
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
transport = transport-udp

[auth-template](!)
type = auth
auth_type = userpass

[aor-template](!)
type = aor
max_contacts = 1
qualify_frequency = 60

; Demo endpoint 1000
[1000](endpoint-template)
aors = 1000
auth = 1000
callerid = Extension 1000 <1000>

[1000](auth-template)
username = 1000
password = 1000pass

[1000](aor-template)
contact = 

; Demo endpoint 1001
[1001](endpoint-template)
aors = 1001
auth = 1001
callerid = Extension 1001 <1001>

[1001](auth-template)
username = 1001
password = 1001pass

[1001](aor-template)
contact = 

; Legacy demo endpoint (for backward compatibility)
[demo-endpoint](endpoint-template)
aors = demo-endpoint
auth = demo-endpoint
callerid = Demo User <demo>

[demo-endpoint](auth-template)
username = demo
password = demo123

[demo-endpoint](aor-template)

