[general]
static = yes
writeprotect = no
clearglobalvars = no
autofallthrough = yes
priorityjumping = no

[globals]
CONSOLE = Console/dsp
IAXINFO = guest
TRUNK = IAX2/user:pass@provider

[default]
; Default context for incoming calls
exten => _X.,1,NoOp(Incoming call to ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()

exten => 100,1,NoOp(Call to extension 100)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Echo()
 same => n,Hangup()

exten => 1000,1,NoOp(Call to extension 1000)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Echo()
 same => n,Hangup()

exten => 1001,1,NoOp(Call to extension 1001)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Echo()
 same => n,Hangup()

; Voicemail access
exten => *98,1,NoOp(Voicemail access)
 same => n,Answer()
 same => n,VoicemailMain()
 same => n,Hangup()

; Echo test
exten => 9999,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Music on hold
exten => 9998,1,NoOp(Music on Hold)
 same => n,Answer()
 same => n,MusicOnHold()
 same => n,Hangup()

[internal]
; Internal extensions context
exten => _1XXX,1,NoOp(Calling extension ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN})
 same => n,Hangup()

exten => h,1,NoOp(Hangup handler)
