[global]
type = global
user_agent = PBX for Dummies Docker

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[demo-endpoint]
type = endpoint
transport = transport-udp
context = default
disallow = all
allow = ulaw,alaw
aors = demo-endpoint
auth = demo-endpoint
language = en

[demo-endpoint]
type = auth
auth_type = userpass
username = demo
password = demo123

[demo-endpoint]
type = aor
max_contacts = 1
